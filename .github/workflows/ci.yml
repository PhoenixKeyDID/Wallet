name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Includes the address golden vectors copied from the Rust core
      # (phoenix_address.rs) — a failure here means the browser derivation has
      # drifted from the canonical CLI derivation.
      - name: Test
        run: bun run test

      - name: Locale parity
        run: bun run check:locales

      # Public repo: a homoglyph swap in a shipped URL would be blessed by the
      # wallet's own brand. An absolute URL may only live in a CODEOWNERS-gated
      # file, so adding one anywhere else pulls in a maintainer review.
      - name: Outbound-URL guard
        run: bun run check:urls

      # A bundler replaces Node built-ins with stubs that throw on first touch.
      # Icarus derivation reaches PBKDF2 -> readable-stream -> events, so a
      # wallet could derive one address under `bun run test` and a different
      # one in Chrome — funds sent somewhere their owner cannot reach, with
      # every Node-side test still green. This builds the real browser bundle
      # and runs it, asserting the golden-vector address and a vault round-trip.
      - name: Browser bundle derives the golden address
        run: bun run check:bundle
