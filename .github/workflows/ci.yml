name: CI

on:
  push:
    branches: [main]
  # `pull_request`, never `pull_request_target`: the latter runs a fork's code
  # with this repo's token and secrets, which is the one thing a public repo's
  # CI must not do.
  pull_request:

# Nothing in this workflow writes to the repo. A token that can only read is a
# token a compromised dependency cannot push with.
permissions:
  contents: read

# A new push to a PR makes the run for the previous head worthless; letting it
# finish only holds the runner. Pushes to main are never cancelled, so every
# commit on main keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the status check `main` requires. Renaming it, or splitting it
  # into one job per runner, would leave the required check waiting forever on a
  # name nothing reports — so the runner is chosen by an expression instead.
  check:
    # The self-hosted runner is persistent and lives on a production machine.
    # Code from a fork is code from anyone: running it there would let a
    # drive-by pull request execute on that machine and leave something behind
    # for the next job. Fork PRs therefore run on a throwaway GitHub-hosted VM.
    # Pushes and PRs from branches of this repo — which only people with write
    # access can create — keep the self-hosted runner. A PR whose head repo is
    # gone reads as `null` here, which is not this repo, so it also goes to the
    # hosted VM: the unknown case falls to the side that cannot hurt the host.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","tiger","isolated"]') || 'ubuntu-latest' }}
    # The whole suite takes a few minutes; a hung step should not hold the
    # runner for GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to point at
      # different code after it was reviewed, a commit hash cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `latest` made the toolchain a moving part: the same commit could
          # pass today and fail tomorrow with no diff to point at. This is the
          # version the lockfile is maintained with locally; bump it in a
          # reviewed diff, together with `bun.lock` if the format changes.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Includes the address golden vectors copied from the Rust core
      # (phoenix_address.rs) — a failure here means the browser derivation has
      # drifted from the canonical CLI derivation.
      - name: Test
        run: bun run test

      - name: Locale parity
        run: bun run check:locales

      # Locale parity compares the languages against each other, so a key
      # missing from all four is a key it grades as fine. Three such keys sat on
      # the success path of money actions — stake delegation, reward withdrawal,
      # a governance submission — and both hosts resolve an unknown key to the
      # key itself, so somebody who had just delegated their stake read the word
      # `delegate_submitted`. This gate compares the code against the strings.
      - name: Every i18n key the code asks for exists
        run: bun run check:i18n-keys

      # This module is consumed as source by host apps, so what a host has to
      # wire up is part of the interface — and it broke without a single red
      # line here: a new `@/lib/keystore` directory and a new dependency landed,
      # the host had neither, and the wallet-creation screen simply did not
      # exist on the site while every gate in this repo passed.
      - name: Host contract
        run: bun run check:host-contract

      # Public repo: a homoglyph swap in a shipped URL would be blessed by the
      # wallet's own brand. An absolute URL may only live in a CODEOWNERS-gated
      # file, so adding one anywhere else pulls in a maintainer review.
      - name: Outbound-URL guard
        run: bun run check:urls

      # ES modules evaluate their imports in source order, and
      # `@stricahq/bip32ed25519` reads a bare `process` while it is still
      # evaluating. The Node-globals shim has to be imported before it, in every
      # module that reaches it. Nothing in the test suite can see this, because
      # `vitest` runs under Node where `process` is real.
      - name: Node-globals guard
        run: bun run check:node-globals

      # The spec and the README both promise the self-custody keystore is
      # reachable only from `LocalWalletPanel` — that promise is what lets the
      # Connect / Watch-only / custody modes be described as key-free. Until
      # this step existed it was an assertion in a document, and the next panel
      # to `import { … } from "@/lib/keystore/session"` would have falsified it
      # everywhere it is written, silently.
      - name: Keystore boundary
        run: bun run check:keystore-boundary

      # Builds the real browser bundle and runs it with `process`, `global` and
      # `setImmediate` deleted — the three Node globals a browser does not have.
      # Two failures hide here, and both are invisible to a green test suite:
      # Icarus derivation could yield one address under `bun run test` and a
      # different one in Chrome (funds sent where their owner cannot reach
      # them), and a missing Node global crashes the popup into a blank page.
      # Measured on 2026-08-29: the second one was real and shipping.
      - name: Browser bundle runs with no Node globals
        run: bun run check:bundle

      # Everything above this line checks source. This builds and checks the
      # package a user drags onto chrome://extensions, because a broken popup
      # entry or an unparseable manifest leaves every source gate green and the
      # extension unloadable — nothing else in CI ever ran the shipping build.
      - name: Build the extension package
        run: bun run build:extension

      # `host_permissions` decides who this wallet may talk to, and widening it
      # is a one-line diff in a file that is not code. Every host declared must
      # appear in the CODEOWNERS-gated provider, the CSP must still forbid
      # remote code, and popup.html must reference nothing outside the package.
      - name: Extension package is loadable and claims no reach it does not use
        run: bun run check:package

      # The extension is a host of this module and was supplying none of the
      # implementations a host owes it, so every one resolved back into the
      # stand-in shipped for standalone type-checking. An import that lands on a
      # stand-in succeeds — nothing anywhere went red — and the packaged wallet
      # printed raw i18n keys at people after they moved money. This reads the
      # built bundle rather than the config, because a declared alias and the
      # module the code reached come apart on ordering alone.
      - name: The extension supplies what a host owes this module
        run: bun run check:extension-host

      # The README's test count has been wrong five times, each time by simply
      # being left behind. A figure a reader catches as stale costs more than a
      # missing one: it teaches them not to trust the rest of the page, which is
      # where this wallet explains what it does NOT protect them from.
      # The popup's stylesheet is typed by hand (the extension has no Tailwind
      # build), and a hand-typed copy only ever falls behind: components gain
      # classes, the copy does not. 90 of 160 were missing once, and the tab row
      # overflowed the popup because of it. Reads the classes the popup's own
      # import graph renders and fails on any without a rule.
      - name: Every class the popup renders has a rule in popup.css
        run: bun run check:popup-css

      - name: README's mechanical claims are still true
        run: bun run check:readme
